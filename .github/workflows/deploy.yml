name: Deploy AmoEvents Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build + rsync to Server A (same box as AmoView)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SPA (vite build)
        run: npm run build

      - name: Set up SSH for deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.API_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync dist/ to Server A
        run: |
          # Replace the app shell, service worker, and manifests, but do not
          # delete hashed assets in the same instant. An older installed PWA
          # can still serve its cached index.html during the SW handover and
          # needs those old chunks long enough to boot and update itself.
          rsync -az --delete --exclude='assets/' -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ ${{ secrets.SERVER_USERNAME }}@${{ secrets.API_SERVER_IP }}:/var/www/amoevents-frontend/dist/
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/assets/ ${{ secrets.SERVER_USERNAME }}@${{ secrets.API_SERVER_IP }}:/var/www/amoevents-frontend/dist/assets/

          # Keep a generous handover window, then remove genuinely abandoned
          # bundles so the asset directory does not grow forever.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USERNAME }}@${{ secrets.API_SERVER_IP }} \
            "find /var/www/amoevents-frontend/dist/assets -type f -mtime +14 -delete"

      - name: Verify
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USERNAME }}@${{ secrets.API_SERVER_IP }} \
            "set -eu
             test -s /var/www/amoevents-frontend/dist/index.html
             for attempt in 1 2 3 4 5; do
               code=\$(curl -ksS -o /dev/null -w '%{http_code}' -H 'Host: events.amoview.com' https://127.0.0.1/ || true)
               echo \"origin attempt \$attempt -> \$code\"
               if [ \"\$code\" = 200 ]; then exit 0; fi
               sleep 2
             done
             echo 'Origin verification failed after retries'
             exit 1"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
